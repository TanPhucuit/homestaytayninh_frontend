<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payment Success - Terra &amp; Leaf</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Libre+Caslon+Text:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#4c6b56",

                        "primary": "#7b2914",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#7e2b16",
                        "on-primary-container": "#ffc9bb",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f4f0eb",
                        "tertiary-fixed-dim": "#ffb4a2",
                        "primary-container": "#9a4029",
                        "tertiary-fixed": "#ffdad2",
                        "on-tertiary-container": "#ffc9bb",
                        "surface-container": "#f1ede8",
                        "outline-variant": "#dcc0ba",
                        "surface-dim": "#ddd9d5",
                        "outline": "#89726c",
                        "surface-container-highest": "#e6e2dd",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-container": "#9a4029",
                        "on-tertiary": "#ffffff",
                        "background": "#fdf9f4",
                        "tertiary": "#7b2914",
                        "inverse-primary": "#ffb4a2",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#ffdad2",
                        "on-secondary-fixed-variant": "#2f4d3a",
                        "on-surface-variant": "#56423d",
                        "on-primary-fixed": "#3c0800",
                        "surface": "#fdf9f4",
                        "on-tertiary-fixed": "#3c0700",
                        "inverse-surface": "#31302d",
                        "secondary": "#466550",

                        "on-secondary-fixed": "#022110",
                        "surface-container-low": "#f7f3ee",
                        "surface-bright": "#fdf9f4",

                        "secondary-fixed": "#c8ebd0",

                        "on-primary-fixed-variant": "#7e2b16",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-mobile": "16px",
                        "gutter-desktop": "24px",
                        "unit": "4px",
                        "margin-edge": "24px",
                        "container-max-width": "1200px"
                    },
                    "fontFamily": {
                        "label-sm": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Libre Caslon Text"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Libre Caslon Text"],
                        "headline-lg": ["Libre Caslon Text"],
                        "display-lg": ["Libre Caslon Text"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],

                        "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface-container-low text-on-surface antialiased min-h-screen flex items-center justify-center p-gutter-mobile md:p-gutter-desktop relative overflow-hidden">
<!-- Decorative ambient background -->
<div class="absolute inset-0 pointer-events-none opacity-40 mix-blend-multiply" style="background-image: radial-gradient(circle at 20% 30%, var(--tw-colors-secondary-container) 0%, transparent 40%), radial-gradient(circle at 80% 70%, var(--tw-colors-tertiary-container) 0%, transparent 40%);"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md relative z-10 animate-[fadeIn_0.5s_ease-out]">
<!-- Success Icon -->
<div class="flex justify-center mb-8">
<div class="w-24 h-24 rounded-full bg-secondary-container flex items-center justify-center shadow-sm relative">
<div class="absolute inset-0 rounded-full animate-ping opacity-20 bg-secondary"></div>
<span class="material-symbols-outlined text-[64px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
</div>
<!-- Typography Header -->
<div class="text-center mb-10 space-y-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">
                Thanh toán thành công!
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                Chào mừng bạn đến với Terra Leaf Núi Bà. Đơn đặt phòng của bạn đã được xác nhận.
            </p>
</div>
<!-- Order Details Card (Bento/Tonal Layer Style) -->
<div class="glass-panel border border-outline-variant rounded-xl p-6 mb-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden">
<!-- subtle texture overlay -->
<div class="absolute inset-0 opacity-[0.02] pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="space-y-4 relative z-10">
<!-- Row 1 -->
<div class="flex justify-between items-center py-2 border-b border-outline-variant/30">
<span class="font-label-md text-label-md text-on-surface-variant">Mã đơn hàng</span>
<span class="font-label-md text-label-md text-on-surface font-semibold tracking-wider">TL-8923A</span>
</div>
<!-- Row 2 -->
<div class="flex justify-between items-center py-2 border-b border-outline-variant/30">
<span class="font-label-md text-label-md text-on-surface-variant">Trạng thái</span>
<div class="bg-secondary/10 text-secondary px-3 py-1 rounded-full flex items-center space-x-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm">Đã thanh toán</span>
</div>
</div>
<!-- Row 3 -->
<div class="flex justify-between items-center py-2 pt-4">
<span class="font-body-md text-body-md text-on-surface-variant">Tổng tiền</span>
<span class="font-headline-md text-headline-md text-primary">3.630.000 VND</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-sm hover:bg-tertiary hover:shadow-md transition-all duration-300 flex items-center justify-center space-x-2 group">
<span>Xem chi tiết đơn hàng</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-secondary text-secondary font-label-md text-label-md py-4 rounded-full hover:bg-secondary-container/50 transition-colors duration-300">
                Về trang chủ
            </button>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
